name: AnyRouter 自动签到
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 开启调试模式（截图 artifact、详细日志）
        required: false
        default: false
        type: boolean
      proxy_validation_only:
        description: 只比较代理节点，不执行签到
        required: false
        default: false
        type: boolean

jobs:
  checkin:
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      DEBUG_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: "latest"

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v5
      id: uv-cache
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      run: |
        uv sync --frozen
        echo "✅ 环境初始化完成"

    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont \
          fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf

    - name: 缓存 CloakBrowser 二进制
      uses: actions/cache@v5
      id: cloakbrowser-cache
      with:
        path: ~/.cloakbrowser
        key: ${{ runner.os }}-cloakbrowser-v1
        restore-keys: |
          ${{ runner.os }}-cloakbrowser-

    - name: 安装 CloakBrowser
      run: |
        uv run python -m cloakbrowser install
        echo "✅ CloakBrowser 安装完成"

    - name: 恢复余额历史缓存
      uses: actions/cache@v5
      with:
        path: balance_hash.txt
        key: balance-hash-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          balance-hash-${{ github.ref_name }}-
          balance-hash-

    - name: 恢复浏览器 Profile 缓存
      uses: actions/cache@v5
      with:
        path: .browser_profiles
        key: browser-profiles-${{ runner.os }}-v1
        restore-keys: |
          browser-profiles-${{ runner.os }}-

    - name: 配置代理
      env:
        PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        PROXY_TEST_URL: https://api.bxacc.xyz/api/status
        PROXY_TEST_MODE: status_json
        PROXY_EXTRA_TEST_URL: https://api.bxacc.xyz/login
        PROXY_EXTRA_TEST_MODE: login_page
        MIHOMO_VERSION: v1.19.27
        PROXY_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.proxy_validation_only == 'true' && 'true' || 'false' }}
      run: bash scripts/setup_checkin_proxy.sh

    - name: 执行签到
      if: ${{ github.event.inputs.proxy_validation_only != 'true' }}
      env:
        DEBUG_MODE: ${{ env.DEBUG_MODE }}
        CHECKIN_HEADLESS: false
        CHECKIN_HUMANIZE: true
        CHECKIN_WAIT_TIMEOUT_MS: 120000
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        ANYROUTER_ACCOUNTS_EXTRA_20260913: ${{ secrets.ANYROUTER_ACCOUNTS_EXTRA_20260913 }}
        ANYROUTER_ACCOUNTS_EXTRA_20260914: ${{ secrets.ANYROUTER_ACCOUNTS_EXTRA_20260914 }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        BARK_KEY: ${{ secrets.BARK_KEY }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
      run: |
        python - <<'PY'
        import json
        import os
        import subprocess
        import sys
        
        extra_keys = [
            "ANYROUTER_ACCOUNTS_EXTRA_20260913",
            "ANYROUTER_ACCOUNTS_EXTRA_20260914",
        ]
        try:
            base = json.loads(os.environ["ANYROUTER_ACCOUNTS"])
            if not isinstance(base, list):
                raise ValueError
            extra = []
            for extra_key in extra_keys:
                parsed_extra = json.loads(os.environ.get(extra_key) or "[]")
                if not isinstance(parsed_extra, list):
                    raise ValueError
                extra.extend(parsed_extra)
            if any(not isinstance(a, dict) for a in base + extra):
                raise ValueError
            for a in extra:
                if a.get("provider", "anyrouter") != "anyrouter":
                    raise ValueError
                if not all(isinstance(a.get(k), str) and a[k] for k in ("email", "password")):
                    raise ValueError
        except (KeyError, ValueError, TypeError, json.JSONDecodeError):
            print("Account configuration invalid; check base/extra Secrets.", file=sys.stderr)
            sys.exit(2)
        
        def identities(a):
            provider = a.get("provider", "anyrouter")
            keys = set()
            if a.get("email"):
                keys.add((provider, "email", str(a["email"])))
            if a.get("api_user") is not None:
                keys.add((provider, "api_user", str(a["api_user"])))
            return keys
        
        seen = set().union(*(identities(a) for a in base))
        merged = list(base)
        added = 0
        for a in extra:
            keys = identities(a)
            if keys & seen:
                continue
            merged.append(a)
            seen.update(keys)
            added += 1
        print(f"Extra accounts: added={added}, skipped={len(extra)-added}", flush=True)
        env = dict(os.environ)
        for extra_key in extra_keys:
            env.pop(extra_key, None)
        env["ANYROUTER_ACCOUNTS"] = json.dumps(merged, ensure_ascii=False)
        result = subprocess.run(
            ["xvfb-run", "-a", "--server-args=-screen 0 1920x1080x24", "uv", "run", "checkin.py"],
            env=env,
        )
        sys.exit(result.returncode)
        PY

    - name: 上传调试截图
      if: always() && env.DEBUG_MODE == 'true'
      env:
        HTTP_PROXY: ''
        HTTPS_PROXY: ''
      uses: actions/upload-artifact@v4
      with:
        name: checkin-screenshots-${{ github.run_id }}
        path: checkin_screenshots/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14

    - name: 停止代理
      if: always()
      run: bash scripts/stop_checkin_proxy.sh

    - name: 执行结果
      if: always()
      run: |
        echo "签到任务执行完成"
        echo "时间: $(date)"
        if [ "${DEBUG_MODE}" = "true" ] && [ -d checkin_screenshots ] && [ "$(ls -A checkin_screenshots 2>/dev/null)" ]; then
          echo "调试截图已上传为 artifact: checkin-screenshots-${{ github.run_id }}"
          ls -la checkin_screenshots/
        fi
