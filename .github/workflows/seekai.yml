name: SeekAI 自动签到

on:
  schedule:
    # 00:05, 08:05, and 16:05 Asia/Shanghai (UTC 16:05, 00:05, 08:05).
    - cron: '5 0,8,16 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 开启调试截图与详细日志
        required: false
        default: false
        type: boolean
      proxy_validation_only:
        description: 只比较代理节点，不执行签到
        required: false
        default: false
        type: boolean

jobs:
  checkin:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      DEBUG_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 缓存 UV 依赖
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: 安装依赖
        run: uv sync --frozen

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-color-emoji fonts-wqy-zenhei

      - name: 缓存 CloakBrowser
        uses: actions/cache@v5
        with:
          path: ~/.cloakbrowser
          key: ${{ runner.os }}-cloakbrowser-v1
          restore-keys: |
            ${{ runner.os }}-cloakbrowser-

      - name: 安装 CloakBrowser
        run: uv run python -m cloakbrowser install

      - name: 恢复 SeekAI 浏览器会话
        uses: actions/cache@v5
        with:
          path: .browser_profiles/seekai
          key: seekai-browser-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            seekai-browser-${{ runner.os }}-

      - name: 配置代理
        env:
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
          PROXY_TEST_URL: https://seekai.cc/api/status
          PROXY_TEST_MODE: status_json
          PROXY_EXTRA_TEST_URL: https://seekai.cc/login
          PROXY_EXTRA_TEST_MODE: login_page
          MIHOMO_VERSION: v1.19.27
          PROXY_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.proxy_validation_only == 'true' && 'true' || 'false' }}
        run: bash scripts/setup_checkin_proxy.sh

      - name: 执行 SeekAI 签到
        if: ${{ github.event.inputs.proxy_validation_only != 'true' }}
        env:
          SEEKAI_ACCOUNT: ${{ secrets.SEEKAI_ACCOUNT }}
          SEEKAI_ACCOUNTS: ${{ secrets.SEEKAI_ACCOUNTS }}
          SEEKAI_USE_PROXY: ${{ secrets.SEEKAI_USE_PROXY || 'false' }}
          CHECKIN_HEADLESS: false
          CHECKIN_HUMANIZE: true
          CHECKIN_WAIT_TIMEOUT_MS: 120000
          DEBUG_MODE: ${{ env.DEBUG_MODE }}
        run: |
          if [[ -z "${SEEKAI_ACCOUNT}" && -z "${SEEKAI_ACCOUNTS}" ]]; then
            echo "ERROR: SEEKAI_ACCOUNTS is not configured"
            exit 1
          fi
          xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run seekai_checkin.py

      - name: 上传调试截图
        if: always() && env.DEBUG_MODE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seekai-screenshots-${{ github.run_id }}
          path: checkin_screenshots/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: 停止代理
        if: always()
        run: bash scripts/stop_checkin_proxy.sh
