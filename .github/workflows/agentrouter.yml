name: AgentRouter 自动签到

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 开启调试截图与详细日志
        required: false
        default: false
        type: boolean
      proxy_validation_only:
        description: 只比较代理节点，不执行签到
        required: false
        default: false
        type: boolean

jobs:
  checkin:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      DEBUG_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 缓存 UV 依赖
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: 安装依赖
        run: uv sync --frozen

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont \
            fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf

      - name: 缓存 CloakBrowser
        uses: actions/cache@v5
        with:
          path: ~/.cloakbrowser
          key: ${{ runner.os }}-cloakbrowser-v1
          restore-keys: |
            ${{ runner.os }}-cloakbrowser-

      - name: 安装 CloakBrowser
        run: uv run python -m cloakbrowser install

      - name: 配置代理
        env:
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
          PROXY_TEST_URL: https://agentrouter.org/api/status
          PROXY_TEST_MODE: status_json
          PROXY_EXTRA_TEST_URL: https://agentrouter.org/login
          PROXY_EXTRA_TEST_MODE: login_page
          MIHOMO_VERSION: v1.19.27
          PROXY_REQUIRED: true
        run: bash scripts/setup_checkin_proxy.sh

      - name: 执行 AgentRouter 签到
        if: ${{ github.event.inputs.proxy_validation_only != 'true' }}
        env:
          ANYROUTER_ACCOUNTS_BASE: ${{ secrets.AGENTROUTER_ACCOUNTS_V2 }}
          ANYROUTER_ACCOUNTS_EXTRA: ${{ secrets.AGENTROUTER_ACCOUNTS_EXTRA }}
          ANYROUTER_ACCOUNTS_ADDED: ${{ secrets.AGENTROUTER_ACCOUNTS_13_17 }}
          ANYROUTER_ACCOUNTS_MORE: ${{ secrets.AGENTROUTER_ACCOUNTS_18_21 }}
          ANYROUTER_ACCOUNTS_SINGLE: ${{ secrets.AGENTROUTER_ACCOUNTS_22 }}
          ANYROUTER_ACCOUNTS_NEXT: ${{ secrets.AGENTROUTER_ACCOUNTS_23 }}
          CHECKIN_HEADLESS: false
          CHECKIN_HUMANIZE: true
          CHECKIN_HUMANIZE_AGENTROUTER: true
          CHECKIN_WAIT_TIMEOUT_MS: 180000
          DEBUG_MODE: ${{ env.DEBUG_MODE }}
        shell: bash
        run: |
          if [[ -z "${ANYROUTER_ACCOUNTS_BASE}" ]]; then
            echo "ERROR: AGENTROUTER_ACCOUNTS_V2 is not configured"
            exit 1
          fi
          if [[ -z "${ANYROUTER_ACCOUNTS_EXTRA}" ]]; then
            echo "ERROR: AGENTROUTER_ACCOUNTS_EXTRA is not configured"
            exit 1
          fi
          if [[ -z "$ANYROUTER_ACCOUNTS_ADDED" ]]; then
            echo "ERROR: AGENTROUTER_ACCOUNTS_13_17 is not configured"
            exit 1
          fi

          if [[ -z "$ANYROUTER_ACCOUNTS_MORE" ]]; then
            echo "ERROR: AGENTROUTER_ACCOUNTS_18_21 is not configured"
            exit 1
          fi

          if [[ -z "$ANYROUTER_ACCOUNTS_SINGLE" ]]; then
            echo "ERROR: AGENTROUTER_ACCOUNTS_22 is not configured"
            exit 1
          fi

          if [[ -z "$ANYROUTER_ACCOUNTS_NEXT" ]]; then
            echo "NOTICE: AGENTROUTER_ACCOUNTS_23 is not configured; running the 22 configured accounts"
          fi

          accounts_file="${RUNNER_TEMP}/agentrouter-accounts.json"
          trap 'rm -f "${accounts_file}"' EXIT
          export AGENTROUTER_ACCOUNTS_FILE="${accounts_file}"

          python - <<'PY'
          import json
          import os
          import re

          base_accounts = json.loads(os.environ["ANYROUTER_ACCOUNTS_BASE"])
          extra_accounts = json.loads(os.environ["ANYROUTER_ACCOUNTS_EXTRA"])
          added_raw = os.environ.get("ANYROUTER_ACCOUNTS_ADDED", "")
          if not added_raw.strip():
              raise SystemExit("ERROR: AGENTROUTER_ACCOUNTS_13_17 is not configured")
          try:
              added_accounts = json.loads(added_raw)
          except json.JSONDecodeError:
              raise SystemExit("ERROR: AGENTROUTER_ACCOUNTS_13_17 is not valid JSON") from None
          more_raw = os.environ.get("ANYROUTER_ACCOUNTS_MORE", "")
          if not more_raw.strip():
              raise SystemExit("ERROR: AGENTROUTER_ACCOUNTS_18_21 is not configured")
          try:
              more_accounts = json.loads(more_raw)
          except json.JSONDecodeError:
              raise SystemExit("ERROR: AGENTROUTER_ACCOUNTS_18_21 is not valid JSON") from None
          if not isinstance(base_accounts, list) or len(base_accounts) != 8:
              raise SystemExit("ERROR: expected exactly 8 base AgentRouter accounts")
          if not isinstance(extra_accounts, list) or len(extra_accounts) != 4:
              raise SystemExit("ERROR: expected exactly 4 extra AgentRouter accounts")
          if not isinstance(added_accounts, list) or len(added_accounts) != 5:
              raise SystemExit("ERROR: expected exactly 5 added AgentRouter accounts")
          if not isinstance(more_accounts, list) or len(more_accounts) != 4:
              raise SystemExit("ERROR: expected exactly 4 more AgentRouter accounts")

          seen_emails = {
              account["email"].strip().casefold()
              for account in base_accounts + extra_accounts
              if isinstance(account, dict) and isinstance(account.get("email"), str)
          }
          for account in added_accounts:
              if not isinstance(account, dict):
                  raise SystemExit("ERROR: each account must be an object")
              for key in ("email", "password"):
                  value = account.get(key)
                  if not isinstance(value, str) or not value:
                      raise SystemExit(f"ERROR: missing {key}")
                  if not value.strip():
                      raise SystemExit(f"ERROR: blank added account {key}")
              email_key = account["email"].strip().casefold()
              if email_key in seen_emails:
                  raise SystemExit("ERROR: duplicate added account email")
              seen_emails.add(email_key)
              if any(char.isspace() for char in account["email"]):
                  raise SystemExit("ERROR: whitespace in added account email")

          for index, account in enumerate(more_accounts, 18):
              if not isinstance(account, dict):
                  raise SystemExit("ERROR: each account must be an object")
              if account.get("name") != f"agentrouter-{index:02d}":
                  raise SystemExit("ERROR: more account aliases or order are invalid")
              if account.get("provider") != "agentrouter":
                  raise SystemExit("ERROR: invalid provider")
              for key in ("email", "password"):
                  value = account.get(key)
                  if not isinstance(value, str) or not value:
                      raise SystemExit(f"ERROR: missing {key}")
                  if not value.strip():
                      raise SystemExit(f"ERROR: blank more account {key}")
              email_key = account["email"].strip().casefold()
              if email_key in seen_emails:
                  raise SystemExit("ERROR: duplicate more account email")
              seen_emails.add(email_key)
              if any(char.isspace() for char in account["email"]):
                  raise SystemExit("ERROR: whitespace in more account email")

          single_raw = os.environ.get("ANYROUTER_ACCOUNTS_SINGLE", "")
          if not single_raw.strip():
              raise SystemExit("ERROR: AGENTROUTER_ACCOUNTS_22 is not configured")
          try:
              single_accounts = json.loads(single_raw)
          except json.JSONDecodeError:
              raise SystemExit("ERROR: AGENTROUTER_ACCOUNTS_22 is not valid JSON") from None
          if not isinstance(single_accounts, list) or len(single_accounts) != 1:
              raise SystemExit("ERROR: expected exactly 1 single AgentRouter account")
          single_account = single_accounts[0]
          if not isinstance(single_account, dict):
              raise SystemExit("ERROR: single account must be an object")
          if single_account.get("name") != "agentrouter-22":
              raise SystemExit("ERROR: single account alias must be agentrouter-22")
          if single_account.get("provider") != "agentrouter":
              raise SystemExit("ERROR: invalid single account provider")
          for key in ("email", "password"):
              value = single_account.get(key)
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"ERROR: missing single account {key}")
              if not value.strip():
                  raise SystemExit(f"ERROR: blank single account {key}")
          email_key = single_account["email"].strip().casefold()
          if email_key in seen_emails:
              raise SystemExit("ERROR: duplicate single account email")
          if any(char.isspace() for char in single_account["email"]):
              raise SystemExit("ERROR: whitespace in single account email")
          seen_emails.add(email_key)

          next_accounts = []
          next_raw = os.environ.get("ANYROUTER_ACCOUNTS_NEXT", "")
          if next_raw.strip():
              try:
                  candidate_accounts = json.loads(next_raw)
              except json.JSONDecodeError:
                  raise SystemExit("ERROR: AGENTROUTER_ACCOUNTS_23 is not valid JSON") from None
              if not isinstance(candidate_accounts, list) or len(candidate_accounts) != 1:
                  raise SystemExit("ERROR: expected exactly 1 next AgentRouter account")
              next_account = candidate_accounts[0]
              if not isinstance(next_account, dict):
                  raise SystemExit("ERROR: next account must be an object")
              if next_account.get("name") != "agentrouter-23":
                  raise SystemExit("ERROR: next account alias must be agentrouter-23")
              if next_account.get("provider") != "agentrouter":
                  raise SystemExit("ERROR: invalid next account provider")
              for key in ("email", "password"):
                  value = next_account.get(key)
                  if not isinstance(value, str) or not value:
                      raise SystemExit(f"ERROR: missing next account {key}")
                  if not value.strip():
                      raise SystemExit(f"ERROR: blank next account {key}")
              email_key = next_account["email"].strip().casefold()
              if email_key in seen_emails:
                  print("WARNING: duplicate next account email; skipping agentrouter-23")
              else:
                  if any(char.isspace() for char in next_account["email"]):
                      raise SystemExit("ERROR: whitespace in next account email")
                  seen_emails.add(email_key)
                  next_accounts = [next_account]

          accounts = base_accounts + extra_accounts + added_accounts + more_accounts + single_accounts + next_accounts
          names = []
          for account in accounts:
              if not isinstance(account, dict):
                  raise SystemExit("ERROR: each account must be an object")
              name = account.get("name")
              if not isinstance(name, str) or not re.fullmatch(r"agentrouter-\d{2}", name):
                  raise SystemExit("ERROR: invalid account alias")
              if account.get("provider") != "agentrouter":
                  raise SystemExit("ERROR: invalid provider")
              for key in ("email", "password"):
                  value = account.get(key)
                  if not isinstance(value, str) or not value:
                      raise SystemExit(f"ERROR: missing {key}")
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::add-mask::{escaped}")
              names.append(name)

          expected_names = [f"agentrouter-{index:02d}" for index in range(1, 23)]
          if next_accounts:
              expected_names.append("agentrouter-23")
          if names != expected_names:
              raise SystemExit("ERROR: account aliases or order are invalid")

          accounts_file = os.environ["AGENTROUTER_ACCOUNTS_FILE"]
          with open(accounts_file, "w", encoding="utf-8") as file:
              json.dump(accounts, file, ensure_ascii=False, separators=(",", ":"))
          os.chmod(accounts_file, 0o600)
          print(f"Validated AgentRouter accounts: count={len(accounts)}")
          PY

          export ANYROUTER_ACCOUNTS="$(<"${accounts_file}")"
          xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run checkin.py

      - name: 上传调试截图
        if: always() && env.DEBUG_MODE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agentrouter-screenshots-${{ github.run_id }}
          path: checkin_screenshots/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: 停止代理
        if: always()
        run: bash scripts/stop_checkin_proxy.sh
